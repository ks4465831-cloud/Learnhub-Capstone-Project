<path d="M40,406 a6,6 0 0 1 6,-6 h248 a6,6 0 0 1 6,6 v26 h-260 z" fill="#0e6b73"/>
<text x="52" y="423" font-size="16" font-weight="700" fill="#ffffff">Enrollment</text>
<text x="52" y="456" font-size="13" fill="#17212b">_id (PK)</text>
<text x="52" y="478" font-size="13" fill="#17212b">student → User</text>
<text x="52" y="500" font-size="13" fill="#17212b">course → Course</text>
<text x="52" y="522" font-size="13" fill="#17212b">completedLessons[] → Lesson</text>
<text x="52" y="544" font-size="13" fill="#17212b">createdAt</text>
<text x="52" y="566" font-size="13" fill="#17212b">UNIQUE index (student, course)</text>
<rect x="420" y="400" width="260" height="182" rx="6" fill="#f6f8fa" stroke="#0a4f56" stroke-width="2"/>
<path d="M420,406 a6,6 0 0 1 6,-6 h248 a6,6 0 0 1 6,6 v26 h-260 z" fill="#0a4f56"/>
<text x="432" y="423" font-size="16" font-weight="700" fill="#ffffff">Quiz</text>
<text x="432" y="456" font-size="13" fill="#17212b">_id (PK)</text>
<text x="432" y="478" font-size="13" fill="#17212b">course → Course</text>
<text x="432" y="500" font-size="13" fill="#17212b">title</text>
<text x="432" y="522" font-size="13" fill="#17212b">passPercentage</text>
<text x="432" y="544" font-size="13" fill="#17212b">questions[] (embedded:</text>
<text x="432" y="566" font-size="13" fill="#17212b">  text, options[], correctIndex)</text>
<rect x="800" y="400" width="260" height="226" rx="6" fill="#f6f8fa" stroke="#0e6b73" stroke-width="2"/>
<path d="M800,406 a6,6 0 0 1 6,-6 h248 a6,6 0 0 1 6,6 v26 h-260 z" fill="#0e6b73"/>
<text x="812" y="423" font-size="16" font-weight="700" fill="#ffffff">Attempt</text>
<text x="812" y="456" font-size="13" fill="#17212b">_id (PK)</text>
<text x="812" y="478" font-size="13" fill="#17212b">student → User</text>
<text x="812" y="500" font-size="13" fill="#17212b">quiz → Quiz</text>
<text x="812" y="522" font-size="13" fill="#17212b">course → Course</text>
<text x="812" y="544" font-size="13" fill="#17212b">answers[]</text>
<text x="812" y="566" font-size="13" fill="#17212b">score, total, percentage</text>
<text x="812" y="588" font-size="13" fill="#17212b">passed</text>
<text x="812" y="610" font-size="13" fill="#17212b">createdAt</text>
<text x="40" y="660" font-size="13" fill="#5b6875">Notes: Attempt.student -> User and Attempt.course -> Course are also references. Modules are embedded in Course; Lessons are a separate collection (referenced).</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>