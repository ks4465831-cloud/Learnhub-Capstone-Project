<text x="52" y="73" font-size="16" font-weight="700" fill="#ffffff">User</text>
<text x="52" y="106" font-size="13" fill="#17212b">_id (PK)</text>
<text x="52" y="128" font-size="13" fill="#17212b">name</text>
<text x="52" y="150" font-size="13" fill="#17212b">email (unique)</text>
<text x="52" y="172" font-size="13" fill="#17212b">password (bcrypt hash)</text>
<text x="52" y="194" font-size="13" fill="#17212b">role: admin | instructor | student</text>
<text x="52" y="216" font-size="13" fill="#17212b">refreshToken</text>
<text x="52" y="238" font-size="13" fill="#17212b">createdAt</text>
<rect x="420" y="50" width="260" height="226" rx="6" fill="#f6f8fa" stroke="#0a4f56" stroke-width="2"/>
<path d="M420,56 a6,6 0 0 1 6,-6 h248 a6,6 0 0 1 6,6 v26 h-260 z" fill="#0a4f56"/>
<text x="432" y="73" font-size="16" font-weight="700" fill="#ffffff">Course</text>
<text x="432" y="106" font-size="13" fill="#17212b">_id (PK)</text>
<text x="432" y="128" font-size="13" fill="#17212b">title</text>
<text x="432" y="150" font-size="13" fill="#17212b">description</text>
<text x="432" y="172" font-size="13" fill="#17212b">category</text>
<text x="432" y="194" font-size="13" fill="#17212b">instructor → User</text>
<text x="432" y="216" font-size="13" fill="#17212b">status: pending | approved | blocked</text>
<text x="432" y="238" font-size="13" fill="#17212b">modules[] (embedded: title, order)</text>
<text x="432" y="260" font-size="13" fill="#17212b">createdAt</text>
<rect x="800" y="50" width="260" height="204" rx="6" fill="#f6f8fa" stroke="#0e6b73" stroke-width="2"/>
<path d="M800,56 a6,6 0 0 1 6,-6 h248 a6,6 0 0 1 6,6 v26 h-260 z" fill="#0e6b73"/>
<text x="812" y="73" font-size="16" font-weight="700" fill="#ffffff">Lesson</text>
<text x="812" y="106" font-size="13" fill="#17212b">_id (PK)</text>
<text x="812" y="128" font-size="13" fill="#17212b">course → Course</text>
<text x="812" y="150" font-size="13" fill="#17212b">module (embedded module _id)</text>
<text x="812" y="172" font-size="13" fill="#17212b">title</text>
<text x="812" y="194" font-size="13" fill="#17212b">content</text>
<text x="812" y="216" font-size="13" fill="#17212b">videoUrl</text>
<text x="812" y="238" font-size="13" fill="#17212b">order</text>
